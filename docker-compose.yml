services:

  backend:
    build: ./backend
    image: backend-inventario:latest
    # Sin "ports": el backend solo es accesible desde la red interna de Compose
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: frontend-inventario:latest
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
