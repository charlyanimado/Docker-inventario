server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # La API se sirve desde el mismo origen: el navegador no necesita
    # conocer la IP del backend y no hace falta CORS
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
    }
}
